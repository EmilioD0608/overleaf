# =============================================================================
# Overleaf Community Edition - Production Docker Compose
# =============================================================================
# Optimizado para despliegue en Dokploy detrás de un reverse proxy con SSL.
#
# USO:
#   1. Copiar .env.example a .env y completar las variables
#   2. Subir este archivo + .env a Dokploy
#   3. Crear directorios de datos: mkdir -p $OVERLEAF_DATA_PATH/{sharelatex_data,mongo_data,redis_data}
#   4. docker compose -f docker-compose.prod.yml up -d
#   5. Crear usuario admin (ver instrucciones en .env.example)
#
# INSTALACIÓN ÚNICA DE TODOS LOS PAQUETES (SCHEME-FULL):
#   Para que todos los paquetes queden guardados permanentemente en el volumen
#   y los deploys futuros tomen solo segundos sin reinstalar nada, ejecuta una sola vez:
#   docker exec -it sharelatex tlmgr option repository https://mirror.ctan.org/systems/texlive/tlnet
#   docker exec -it sharelatex tlmgr update --self
#   docker exec -it sharelatex tlmgr install scheme-full
#
# IMPORTANTE: Este compose usa la Community Edition (CE).
# Sandboxed Compiles NO están disponibles en CE (requieren Server Pro).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Overleaf Application
  # ---------------------------------------------------------------------------
  sharelatex:
    build: .
    image: sharelatex/sharelatex:custom
    container_name: sharelatex
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8.5G
        reservations:
          cpus: '2'
          memory: 4G
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "80"
    stop_grace_period: 60s
    volumes:
      - ${OVERLEAF_DATA_PATH:-/opt/overleaf}/sharelatex_data:/var/lib/overleaf
    tmpfs:
      # Montaje de temporales y directorio de compilación en RAM para acelerar I/O
      - /var/lib/overleaf/tmp:exec,size=1G
      - /var/lib/overleaf/data/compiles:rw,noexec,nosuid,size=2G
    environment:
      # --- DNS / Node options / GC ---
      NODE_OPTIONS: "--dns-result-order=ipv4first --max-old-space-size=2048"

      # --- Identidad del sitio ---
      OVERLEAF_APP_NAME: ${OVERLEAF_APP_NAME:-Overleaf Community Edition}
      OVERLEAF_SITE_URL: ${OVERLEAF_SITE_URL:-http://localhost}
      OVERLEAF_NAV_TITLE: ${OVERLEAF_NAV_TITLE:-Overleaf Community Edition}

      # --- Base de datos ---
      OVERLEAF_MONGO_URL: "mongodb://mongo/sharelatex"
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # --- Seguridad ---
      OVERLEAF_SESSION_SECRET: "${OVERLEAF_SESSION_SECRET:?ERROR - Genera con openssl rand -base64 32}"
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET:-}

      # --- Funcionalidades ---
      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"
      ENABLE_CONVERSIONS: "true"
      EMAIL_CONFIRMATION_DISABLED: "true"

      # --- Optimización de Compilación LaTeX (CLSI) ---
      COMPILE_TIMEOUT: ${COMPILE_TIMEOUT:-180}
      FILESTORE_PARALLEL_FILE_DOWNLOADS: "4"
      DISABLE_PER_USER_COMPILES: "true"
      ENABLE_PDF_CACHING: "true"
      ENABLE_PDF_CACHING_DARK: "false"
      PDF_CACHING_ENABLE_WORKER_POOL: "true"
      PDF_CACHING_WORKER_POOL_SIZE: "4"
      TEXLIVE_MAX_PRINT_LINE: "1000"

      # --- Limpieza de Recursos y Rendimiento Frontend ---
      ENABLE_CRON_RESOURCE_DELETION: "true"
      PRECOMPILE_PUG_TEMPLATES_AT_BOOT_TIME: "true"

      # --- Idioma ---
      OVERLEAF_SITE_LANGUAGE: ${OVERLEAF_SITE_LANGUAGE:-es}

      # --- Proxy (tu reverse proxy maneja SSL) ---
      OVERLEAF_BEHIND_PROXY: "true"
      OVERLEAF_SECURE_COOKIE: ${OVERLEAF_SECURE_COOKIE:-true}

      # --- Personalización (opcional) ---
      # OVERLEAF_HEADER_IMAGE_URL: ${OVERLEAF_HEADER_IMAGE_URL:-}
      # OVERLEAF_ADMIN_EMAIL: ${OVERLEAF_ADMIN_EMAIL:-}
      # OVERLEAF_LEFT_FOOTER: ${OVERLEAF_LEFT_FOOTER:-}
      # OVERLEAF_RIGHT_FOOTER: ${OVERLEAF_RIGHT_FOOTER:-}

      # --- Email SMTP ---
      OVERLEAF_EMAIL_FROM_ADDRESS: ${OVERLEAF_EMAIL_FROM_ADDRESS:-noreply@serverteced.cloud}
      OVERLEAF_EMAIL_SMTP_HOST: ${OVERLEAF_EMAIL_SMTP_HOST:-mail.serverteced.cloud}
      OVERLEAF_EMAIL_SMTP_PORT: ${OVERLEAF_EMAIL_SMTP_PORT:-587}
      OVERLEAF_EMAIL_SMTP_SECURE: ${OVERLEAF_EMAIL_SMTP_SECURE:-false}
      OVERLEAF_EMAIL_SMTP_USER: ${OVERLEAF_EMAIL_SMTP_USER:-}
      OVERLEAF_EMAIL_SMTP_PASS: ${OVERLEAF_EMAIL_SMTP_PASS:-}
      OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH: ${OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH:-true}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - overleaf-net

  # ---------------------------------------------------------------------------
  # MongoDB (con Replica Set y Caché WiredTiger optimizada)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    command: ["--replSet", "overleaf", "--wiredTigerCacheSizeGB", "1.5"]
    deploy:
      resources:
        limits:
          memory: 2.5G
        reservations:
          memory: 1G
    volumes:
      - ${OVERLEAF_DATA_PATH:-/opt/overleaf}/mongo_data:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      # Requerido para la inicialización automática del replica set
      - "mongo:127.0.0.1"
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - overleaf-net

  # ---------------------------------------------------------------------------
  # Redis (con política de desalojo Volatile-LRU)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "768mb", "--maxmemory-policy", "volatile-lru", "--save", "900", "1", "300", "10"]
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - ${OVERLEAF_DATA_PATH:-/opt/overleaf}/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - overleaf-net

# =============================================================================
# Redes
# =============================================================================
networks:
  overleaf-net:
    driver: bridge
