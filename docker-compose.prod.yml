# =============================================================================
# Overleaf Community Edition - Production Docker Compose
# =============================================================================
# Optimizado para despliegue en Dokploy detrás de un reverse proxy con SSL.
#
# USO:
#   1. Copiar .env.example a .env y completar las variables
#   2. Subir este archivo + .env a Dokploy
#   3. Crear directorios de datos: mkdir -p $OVERLEAF_DATA_PATH/{sharelatex_data,mongo_data,redis_data}
#   4. docker compose -f docker-compose.prod.yml up -d
#   5. Crear usuario admin (ver instrucciones en .env.example)
#
# IMPORTANTE: Este compose usa la Community Edition (CE).
# Sandboxed Compiles NO están disponibles en CE (requieren Server Pro).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Overleaf Application
  # ---------------------------------------------------------------------------
  sharelatex:
    image: sharelatex/sharelatex
    container_name: sharelatex
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${OVERLEAF_PORT:-80}:80"
    stop_grace_period: 60s
    volumes:
      - ${OVERLEAF_DATA_PATH:-/opt/overleaf}/sharelatex_data:/var/lib/overleaf
    environment:
      # --- DNS / Node options ---
      NODE_OPTIONS: "--dns-result-order=ipv4first"

      # --- Identidad del sitio ---
      OVERLEAF_APP_NAME: ${OVERLEAF_APP_NAME:-Overleaf Community Edition}
      OVERLEAF_SITE_URL: ${OVERLEAF_SITE_URL:-http://localhost}
      OVERLEAF_NAV_TITLE: ${OVERLEAF_NAV_TITLE:-Overleaf Community Edition}

      # --- Base de datos ---
      OVERLEAF_MONGO_URL: "mongodb://mongo/sharelatex"
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # --- Seguridad ---
      OVERLEAF_SESSION_SECRET: "${OVERLEAF_SESSION_SECRET:?ERROR - Genera con openssl rand -base64 32}"
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET:-}

      # --- Funcionalidades ---
      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"
      ENABLE_CONVERSIONS: "true"
      EMAIL_CONFIRMATION_DISABLED: "true"

      # --- Compilación ---
      COMPILE_TIMEOUT: ${COMPILE_TIMEOUT:-240}

      # --- Idioma ---
      OVERLEAF_SITE_LANGUAGE: ${OVERLEAF_SITE_LANGUAGE:-es}

      # --- Proxy (tu reverse proxy maneja SSL) ---
      OVERLEAF_BEHIND_PROXY: "true"
      OVERLEAF_SECURE_COOKIE: ${OVERLEAF_SECURE_COOKIE:-true}

      # --- Personalización (opcional) ---
      # OVERLEAF_HEADER_IMAGE_URL: ${OVERLEAF_HEADER_IMAGE_URL:-}
      # OVERLEAF_ADMIN_EMAIL: ${OVERLEAF_ADMIN_EMAIL:-}
      # OVERLEAF_LEFT_FOOTER: ${OVERLEAF_LEFT_FOOTER:-}
      # OVERLEAF_RIGHT_FOOTER: ${OVERLEAF_RIGHT_FOOTER:-}

      # --- Email SMTP (deshabilitado por defecto) ---
      # OVERLEAF_EMAIL_FROM_ADDRESS: ${OVERLEAF_EMAIL_FROM_ADDRESS:-}
      # OVERLEAF_EMAIL_SMTP_HOST: ${OVERLEAF_EMAIL_SMTP_HOST:-}
      # OVERLEAF_EMAIL_SMTP_PORT: ${OVERLEAF_EMAIL_SMTP_PORT:-587}
      # OVERLEAF_EMAIL_SMTP_SECURE: ${OVERLEAF_EMAIL_SMTP_SECURE:-false}
      # OVERLEAF_EMAIL_SMTP_USER: ${OVERLEAF_EMAIL_SMTP_USER:-}
      # OVERLEAF_EMAIL_SMTP_PASS: ${OVERLEAF_EMAIL_SMTP_PASS:-}
      # OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - overleaf-net

  # ---------------------------------------------------------------------------
  # MongoDB (con Replica Set requerido por Overleaf)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    command: "--replSet overleaf"
    volumes:
      - ${OVERLEAF_DATA_PATH:-/opt/overleaf}/mongo_data:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      # Requerido para la inicialización automática del replica set
      - "mongo:127.0.0.1"
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - overleaf-net

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:6.2
    container_name: redis
    restart: unless-stopped
    volumes:
      - ${OVERLEAF_DATA_PATH:-/opt/overleaf}/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - overleaf-net

# =============================================================================
# Red aislada
# =============================================================================
networks:
  overleaf-net:
    driver: bridge
